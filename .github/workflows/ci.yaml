name: CI

on: [push]

jobs:
  test_app:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test script
        run: |
          node --version
          npm test

  build_app:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    needs: test_app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script
        run: |
          npm run build
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devops-lab5-${{ github.sha }}
          path: dist/
          retention-days: 7

